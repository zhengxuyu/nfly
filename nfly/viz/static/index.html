<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nfly viewer</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --fg: #e6e6e6; --dim: #8b93a7; --acc: #ffb454; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(320px, 2fr) minmax(280px, 1fr); gap: 16px; padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  canvas#frame { display: block; margin: 0 auto; max-width: 100%; max-height: 62vh; width: auto; image-rendering: pixelated; background: #000; border-radius: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button { background: #222733; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  input[type=range] { width: 120px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .stat { background: #12151b; border-radius: 6px; padding: 8px; }
  .stat .k { color: var(--dim); font-size: 12px; }
  .stat .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
  .probs .row { display: grid; grid-template-columns: 90px 1fr 48px; gap: 8px; align-items: center; margin: 3px 0; }
  .probs .bar { height: 10px; background: #12151b; border-radius: 5px; overflow: hidden; }
  .probs .bar i { display: block; height: 100%; background: var(--acc); width: 0; transition: width .1s; }
  .probs .row.chosen .name { color: var(--acc); }
  #timeline { width: 100%; height: 56px; display: block; background: #12151b; border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--dim); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 3px 6px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: normal; }
  #log { max-height: 260px; overflow: auto; }
  .status { color: var(--dim); }
  .status.err { color: #ff7b72; }
</style>
</head>
<body>
<header>
  <h1>nfly viewer</h1>
  <span class="meta" id="meta">connecting...</span>
  <span class="status" id="status"></span>
</header>
<main>
  <section class="panel">
    <canvas id="frame" width="160" height="210"></canvas>
    <div class="controls">
      <button id="btnPause">Pause</button>
      <button id="btnStep">Step</button>
      <button id="btnReset">Reset episode</button>
      <label>fps <input type="range" id="fps" min="1" max="60" step="1"> <span id="fpsv"></span></label>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">step</div><div class="v" id="sStep">0</div></div>
      <div class="stat"><div class="k">episode</div><div class="v" id="sEp">0</div></div>
      <div class="stat"><div class="k">episode return</div><div class="v" id="sRet">0</div></div>
      <div class="stat"><div class="k">last reward</div><div class="v" id="sRew">0</div></div>
    </div>
  </section>
  <aside class="panel">
    <h2>Action probabilities</h2>
    <div class="probs" id="probs"></div>
    <h2 style="margin-top:14px">Action timeline (last 256 steps)</h2>
    <canvas id="timeline" width="600" height="56"></canvas>
    <div class="legend" id="legend"></div>
    <h2 style="margin-top:14px">Recent steps</h2>
    <div id="log"><table><thead><tr><th>step</th><th>action</th><th>reward</th></tr></thead><tbody id="logBody"></tbody></table></div>
  </aside>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const palette = ['#ffb454', '#59c2ff', '#aad94c', '#f07178', '#d2a6ff', '#95e6cb', '#f29e74', '#e6b450', '#73b8ff', '#ff8f40',
                   '#c2d94c', '#ffee99', '#7fd962', '#f28779', '#dfbfff', '#5ccfe6', '#ffcc66', '#bae67e', '#ff3333', '#a37acc'];
  const state = { names: [], history: [], paused: false, fps: 15 };
  const frame = $('frame'), fctx = frame.getContext('2d');
  const tl = $('timeline'), tctx = tl.getContext('2d');
  const img = new Image();

  function setStatus(msg, err) { const s = $('status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); }

  function drawFrame(b64) {
    img.onload = () => { if (frame.width !== img.width || frame.height !== img.height) { frame.width = img.width; frame.height = img.height; } fctx.drawImage(img, 0, 0); };
    img.src = 'data:image/jpeg;base64,' + b64;
  }

  function buildProbs() {
    $('probs').innerHTML = state.names.map((n, i) =>
      `<div class="row" id="p${i}"><span class="name">${n}</span><div class="bar"><i style="background:${palette[i % palette.length]}"></i></div><span class="val">0.00</span></div>`).join('');
    $('legend').innerHTML = state.names.map((n, i) => `<span><i style="background:${palette[i % palette.length]}"></i>${n}</span>`).join('');
  }

  function drawProbs(probs, chosen) {
    if (!probs) return;
    probs.forEach((p, i) => { const r = $('p' + i); if (!r) return; r.querySelector('i').style.width = (p * 100) + '%'; r.querySelector('.val').textContent = p.toFixed(2); r.classList.toggle('chosen', i === chosen); });
  }

  function drawTimeline() {
    const w = tl.width = tl.clientWidth || 600, h = tl.height, n = 256;
    tctx.fillStyle = '#12151b'; tctx.fillRect(0, 0, w, h);
    const hist = state.history.slice(-n), cw = w / n;
    hist.forEach((e, i) => {
      const a = typeof e.action === 'number' ? e.action : 0;
      tctx.fillStyle = palette[a % palette.length];
      tctx.fillRect(i * cw, 8, Math.max(cw - 0.5, 1), h - 16);
      if (e.reward > 0) { tctx.fillStyle = '#aad94c'; tctx.fillRect(i * cw, 0, Math.max(cw, 1), 5); }
      if (e.reward < 0) { tctx.fillStyle = '#f07178'; tctx.fillRect(i * cw, h - 5, Math.max(cw, 1), 5); }
    });
  }

  function pushLog(e) {
    const tb = $('logBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.step}</td><td style="color:${palette[(e.action|0) % palette.length]}">${e.action_name}</td><td>${e.reward.toFixed(2)}</td>`;
    tb.prepend(tr);
    while (tb.children.length > 40) tb.removeChild(tb.lastChild);
  }

  function onEvent(e) {
    drawFrame(e.frame_jpeg_b64);
    drawProbs(e.probs, e.action);
    state.history.push(e); if (state.history.length > 512) state.history.shift();
    drawTimeline(); pushLog(e);
    $('sStep').textContent = e.step; $('sEp').textContent = e.episode;
    $('sRet').textContent = e.episode_return.toFixed(1); $('sRew').textContent = e.reward.toFixed(2);
  }

  async function control(cmd, extra) {
    const r = await fetch('/api/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ cmd }, extra || {})) });
    const j = await r.json();
    if (j.paused !== undefined) { state.paused = j.paused; $('btnPause').textContent = state.paused ? 'Resume' : 'Pause'; }
    return j;
  }

  $('btnPause').onclick = () => control(state.paused ? 'resume' : 'pause');
  $('btnStep').onclick = () => control('step');
  $('btnReset').onclick = () => control('reset');
  $('fps').oninput = ev => { $('fpsv').textContent = ev.target.value; };
  $('fps').onchange = ev => control('fps', { fps: +ev.target.value });

  async function init() {
    const s = await (await fetch('/api/state')).json();
    state.names = s.action_names; state.history = s.history || []; state.paused = s.paused; state.fps = s.fps;
    $('meta').textContent = `${s.suite}/${s.game}  policy=${s.policy}${s.subset ? ' subset=' + s.subset : ''}${s.checkpoint ? ' ckpt=' + s.checkpoint : ''}`;
    $('fps').value = s.fps; $('fpsv').textContent = s.fps; $('btnPause').textContent = s.paused ? 'Resume' : 'Pause';
    buildProbs(); drawTimeline();
    const es = new EventSource('/api/stream');
    es.onmessage = m => { const e = JSON.parse(m.data); if (e.error) { setStatus('backend error: ' + e.error.split('\n').slice(-2).join(' '), true); return; } onEvent(e); };
    if (s.error) setStatus('backend error: ' + s.error.split('\n').slice(-2).join(' '), true);
    es.onopen = () => setStatus('live');
    es.onerror = () => setStatus('stream disconnected, retrying', true);
  }
  init().catch(e => setStatus('failed to load state: ' + e, true));
  window.addEventListener('resize', drawTimeline);
})();
</script>
</body>
</html>
