[project]
name = "nfly"
version = "0.1.0"
description = "A fly connectome (Janelia MaleCNS v1.0) as a recurrent neural network that plays any Gymnasium game"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "pandas>=2.0", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
games = ["gymnasium>=1.0", "ale-py>=0.10", "opencv-python-headless>=4.8", "pygame>=2.5"]
rllib = ["ray[rllib]>=2.40", "pillow>=10"]
dev = ["pytest", "gymnasium>=1.0", "ale-py>=0.10", "opencv-python-headless>=4.8", "pygame>=2.5", "ray[rllib]>=2.40", "pillow>=10"]

[tool.setuptools]
packages = ["nfly", "nfly.connectome", "nfly.brain", "nfly.interface", "nfly.suite", "nfly.rl", "nfly.rl.simple", "nfly.rl.rllib", "nfly.viz"]

[tool.setuptools.package-data]
nfly = ["viz/static/*.html"]
